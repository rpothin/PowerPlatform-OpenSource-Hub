name: Bug report
description: Report a reproducible problem with the Hub.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Do not include credentials, private data, or unredacted sensitive logs."
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Website
        - Repository data
        - TypeScript pipeline
        - PowerShell scripts
        - Documentation
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and its impact.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: List the steps needed to reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Describe what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add relevant links or screenshots, with sensitive information removed.
    validations:
      required: false
