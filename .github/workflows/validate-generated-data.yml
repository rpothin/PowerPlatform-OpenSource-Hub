name: Validate generated data and automation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-generated-data-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-generated-data:
    name: validate-generated-data
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Pipeline/package-lock.json

      - name: Install TypeScript pipeline dependencies
        working-directory: Pipeline
        run: npm ci --ignore-scripts

      - name: Type-check pipeline
        working-directory: Pipeline
        run: npm run typecheck

      - name: Run pipeline and automation contract tests
        working-directory: Pipeline
        run: npm test

      - name: Enforce the automation auto-merge kill switch
        if: github.head_ref == 'automation/update-github-repositories-details' || github.head_ref == 'automation/update-readme-with-github-repositories-details' || github.head_ref == 'automation/snapshot-github-repositories-popularity-score'
        env:
          AUTOMATION_AUTO_MERGE_ENABLED: ${{ vars.ENABLE_AUTOMATION_AUTO_MERGE || 'false' }}
        run: |
          if [[ "$AUTOMATION_AUTO_MERGE_ENABLED" != "true" ]]; then
            echo "The shared automation auto-merge switch is disabled."
            exit 1
          fi

      - name: Build pipeline CLI
        working-directory: Pipeline
        run: npm run build

      - name: Validate scheduled refresh path allowlist
        if: github.head_ref == 'automation/update-github-repositories-details'
        env:
          BASE_REF: ${{ github.base_ref }}
          PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only "origin/${BASE_REF}...${PULL_REQUEST_HEAD_SHA}" \
            | node -e 'let input = ""; process.stdin.on("data", chunk => input += chunk).on("end", () => process.stdout.write(JSON.stringify(input.split(/\r?\n/).filter(Boolean))))' \
            | node Scripts/refresh-pr-policy.mjs validate-paths

      - name: Recheck scheduled refresh repository-count delta
        if: github.head_ref == 'automation/update-github-repositories-details'
        env:
          BASE_REF: ${{ github.base_ref }}
          PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          BASE="origin/${BASE_REF}"
          # Use the candidate's merge-base to reproduce the exact baseline used during generation.
          BASELINE_COMMIT="$(git merge-base "$BASE" "$PULL_REQUEST_HEAD_SHA")"
          if git cat-file -e "${BASELINE_COMMIT}:Data/GeneratedRepositories" 2>/dev/null; then
            baseline_paths="$(git ls-tree -r --name-only "$BASELINE_COMMIT" -- Data/GeneratedRepositories)"
            baseline_count="$(printf '%s\n' "$baseline_paths" | awk 'NF && /\.json$/ { count += 1 } END { print count + 0 }')"
          else
            baseline_count="$(git show "${BASELINE_COMMIT}:Data/GitHubRepositoriesDetails.json" | node -e 'let input = ""; process.stdin.on("data", chunk => input += chunk).on("end", () => { const records = JSON.parse(input); if (!Array.isArray(records)) throw new Error("Base merged data must be a JSON array."); process.stdout.write(String(records.length)); })')"
          fi
          candidate_paths="$(git ls-tree -r --name-only "$PULL_REQUEST_HEAD_SHA" -- Data/GeneratedRepositories)"
          candidate_count="$(printf '%s\n' "$candidate_paths" | awk 'NF && /\.json$/ { count += 1 } END { print count + 0 }')"
          node Scripts/refresh-pr-policy.mjs validate-count "$baseline_count" "$candidate_count"

      - name: Validate committed generated records and overlays
        run: |
          node Pipeline/dist/cli.js merge \
            --generated-dir Data/GeneratedRepositories \
            --overlay-dir Data/CuratedRepositories \
            --schema Configuration/Schemas/GitHubRepositoriesDetails.schema.json \
            --generated-schema Configuration/Schemas/GitHubRepositoryGenerated.schema.json \
            --output Pipeline/Output/pr-validation/GitHubRepositoriesDetails.json \
            --taxonomy-dir Configuration/Taxonomy \
            --sentinels Configuration/SentinelRepositories.json

      - name: Ensure scheduled auto-merge candidate matches the merged artifact
        if: github.head_ref == 'automation/update-github-repositories-details'
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { isDeepStrictEqual } from 'node:util';

          const [committed, generated] = await Promise.all([
            readFile('Data/GitHubRepositoriesDetails.json', 'utf8'),
            readFile('Pipeline/Output/pr-validation/GitHubRepositoriesDetails.json', 'utf8')
          ]);

          if (!isDeepStrictEqual(JSON.parse(committed), JSON.parse(generated))) {
            throw new Error('The scheduled auto-merge candidate does not match the validated generated-plus-curated merge.');
          }
          NODE

      - name: Validate automated README provenance and deterministic rendering
        if: github.head_ref == 'automation/update-readme-with-github-repositories-details' || github.head_ref == 'automation/manual-update-readme-with-github-repositories-details'
        env:
          BASE_REF: ${{ github.base_ref }}
          README_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          README_BRANCH: ${{ github.head_ref }}
          CONFIGURATION_FILE_PATH: ${{ vars.CONFIGURATION_FILE_PATH || 'Configuration/GitHubRepositoriesSearchCriteria.json' }}
          DATA_FILE_PATH: ${{ vars.DATA_FILE_PATH || 'Data/GitHubRepositoriesDetails.json' }}
          DATA_SNAPSHOT_FILE_PATH: ${{ vars.DATA_SNAPSHOT_FILE_PATH || 'Data/GitHubRepositoriesPopularityScoresSnapshot.json' }}
        run: |
          git fetch origin "$BASE_REF" --quiet
          node Scripts/validate-readme-pr.mjs \
            "$README_HEAD_SHA" \
            "$BASE_REF" \
            "$README_BRANCH" \
            "$CONFIGURATION_FILE_PATH" \
            "$DATA_FILE_PATH" \
            "$DATA_SNAPSHOT_FILE_PATH"

      - name: Validate automated popularity snapshot
        if: github.head_ref == 'automation/snapshot-github-repositories-popularity-score' || github.head_ref == 'automation/manual-snapshot-github-repositories-popularity-score'
        env:
          BASE_REF: ${{ github.base_ref }}
          SNAPSHOT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DATA_FILE_PATH: ${{ vars.DATA_FILE_PATH || 'Data/GitHubRepositoriesDetails.json' }}
          DATA_SNAPSHOT_FILE_PATH: ${{ vars.DATA_SNAPSHOT_FILE_PATH || 'Data/GitHubRepositoriesPopularityScoresSnapshot.json' }}
          DATA_SNAPSHOT_METADATA_FILE_PATH: Data/GitHubRepositoriesPopularityScoresSnapshotMetadata.json
        run: |
          set -euo pipefail
          git fetch origin "$BASE_REF" --quiet
          normalize_path() {
            node -e 'process.stdout.write(process.argv[1].replaceAll("\\", "/").replace(/^\.\//, ""))' "$1"
          }
          SOURCE_DATA_PATH="$(normalize_path "$DATA_FILE_PATH")"
          SNAPSHOT_PATH="$(normalize_path "$DATA_SNAPSHOT_FILE_PATH")"
          METADATA_PATH="$(normalize_path "$DATA_SNAPSHOT_METADATA_FILE_PATH")"

          git diff --name-only "origin/${BASE_REF}...${SNAPSHOT_HEAD_SHA}" \
            | node Scripts/validate-generated-snapshot.mjs --validate-paths "$SNAPSHOT_PATH" "$METADATA_PATH"

          source_commit="$(git show "${SNAPSHOT_HEAD_SHA}:${METADATA_PATH}" \
            | node -e 'const fs=require("node:fs"); process.stdout.write(JSON.parse(fs.readFileSync(0,"utf8"))._sourceCommit ?? "")')"
          if [[ ! "$source_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Snapshot metadata contains an invalid source commit."
            exit 1
          fi
          git merge-base --is-ancestor "$source_commit" "origin/${BASE_REF}"
          if ! git diff --quiet "$source_commit" "origin/${BASE_REF}" -- "$SOURCE_DATA_PATH"; then
            echo "Snapshot is stale because its source details artifact differs from the current base."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/snapshot-validation"
          git show "${source_commit}:${SOURCE_DATA_PATH}" > "$RUNNER_TEMP/snapshot-validation/source.json"
          git show "${SNAPSHOT_HEAD_SHA}:${SNAPSHOT_PATH}" > "$RUNNER_TEMP/snapshot-validation/snapshot.json"
          git show "${SNAPSHOT_HEAD_SHA}:${METADATA_PATH}" > "$RUNNER_TEMP/snapshot-validation/metadata.json"
          node Scripts/validate-generated-snapshot.mjs \
            "$RUNNER_TEMP/snapshot-validation/source.json" \
            "$RUNNER_TEMP/snapshot-validation/snapshot.json" \
            "$RUNNER_TEMP/snapshot-validation/metadata.json"

      - name: Install website dependencies for snapshot candidates
        if: github.head_ref == 'automation/snapshot-github-repositories-popularity-score' || github.head_ref == 'automation/manual-snapshot-github-repositories-popularity-score'
        working-directory: Website
        run: npm ci --ignore-scripts

      - name: Validate website for snapshot candidates
        if: github.head_ref == 'automation/snapshot-github-repositories-popularity-score' || github.head_ref == 'automation/manual-snapshot-github-repositories-popularity-score'
        working-directory: Website
        run: |
          npm run typecheck
          npm run test:unit
          npm run build
