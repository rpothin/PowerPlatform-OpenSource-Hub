name: backend-pipeline-ci-validation
# CI gate: typecheck, unit tests, and dry-run for the TypeScript backend pipeline.

on:
  pull_request:
    paths:
      - 'Pipeline/**'
      - 'Configuration/GitHubRepositoriesSearchCriteria.json'
      - 'Configuration/SentinelRepositories.json'
      - 'Configuration/Schemas/**'
      - 'Configuration/Taxonomy/**'
      - 'Data/CuratedRepositories/**'
      - '.github/workflows/backend-pipeline-ci-validation.yml'
      - '.github/workflows/backend-pipeline-manual-validation.yml'
      - '.github/workflows/update-github-repositories-details.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-pipeline-ci-validation-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-typescript-candidate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Pipeline/package-lock.json

      - name: Install dependencies
        working-directory: Pipeline
        run: npm ci --ignore-scripts

      - name: Type-check TypeScript candidate
        working-directory: Pipeline
        run: npm run typecheck

      - name: Test TypeScript candidate
        working-directory: Pipeline
        run: npm test

      - name: Run TypeScript dry-run generation and merge
        working-directory: Pipeline
        run: npm run dry-run

      - name: Upload TypeScript dry-run artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: typescript-candidate-dry-run
          path: Pipeline/Output/
