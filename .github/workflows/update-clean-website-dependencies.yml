name: 0-update-clean-website-dependencies
# Update and clean website dependencies

# Workflow triggered every week on Tuesday at 11:00 AM EST
# Can also be triggered manually without input parameters
on:
    schedule:
      - cron: '0 15 * * 2' # Every Tuesday at 11:00 AM EST
    workflow_dispatch:

permissions:
  contents: read

# Concurrency configuration for the current workflow - Keep only the latest workflow queued for the considered group
concurrency:
  group: update-clean-website-dependencies
  cancel-in-progress: true

jobs:
    update-clean-website-dependencies:
        runs-on: ubuntu-latest
        env:
          RUNNER_DEBUG: 1

        steps:
            # Action used to checkout the main branch in the current repository
            #   Community action: https://github.com/actions/checkout
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                ref: main
                fetch-depth: 0
                persist-credentials: false

            # Set a current date environment variable in the following format: YYYYMMDD
            - name: Set current date as env variable
              id: current_date
              run: echo "NOW=$(date +'%Y%m%d')" >> $env:GITHUB_OUTPUT
              shell: pwsh

            # Setup Node.js
            #  Action: https://github.com/actions/setup-node
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                node-version: 20

            # Install dependencies and update dependencies
            - name: Install dependencies and update dependencies
              working-directory: Website
              run: |
                npm install --global --ignore-scripts npm-check-updates@23.1.0
                npm ci --ignore-scripts
                ncu -u
                npm install --ignore-scripts

            # Remove unused dependencies
            - name: Remove unused dependencies
              working-directory: Website
              run: |
                npm install --global --ignore-scripts depcheck@1.4.7
                depcheck || true
                unused=$(depcheck --json | jq -r '.dependencies[]')
                if [ -z "$unused" ]; then
                    echo "No unused dependencies to uninstall"
                else
                    for pkg in $unused; do echo "Uninstalling $pkg"; npm uninstall $pkg; done
                fi

            # Build the website
            - name: Build website
              working-directory: Website
              run: |
                npm run build
            
            # Run unit tests
            - name: Run unit tests
              working-directory: Website
              run: |
                npm run test:unit

            - name: Open pull request for dependency updates
              env:
                GH_TOKEN: ${{ secrets.PAT_WORKFLOW_UPDATE }}
              run: |
                set -euo pipefail
                git config --local user.email "action@github.com"
                git config --local user.name "GitHub Action"

                git add Website/package.json Website/package-lock.json
                if git diff --cached --quiet; then
                    echo "No dependency changes to propose."
                    exit 0
                else
                    diff_exit_code=$?
                    if [ "$diff_exit_code" -ne 1 ]; then
                        echo "::error::Unable to check staged dependency changes."
                        exit "$diff_exit_code"
                    fi
                fi

                if ! existing_branches=$(gh pr list --state open --base main --json headRefName --jq '.[] | select(.headRefName | startswith("automation/update-clean-website-dependencies-")) | .headRefName'); then
                    echo "::error::Unable to check for an existing dependency-update pull request."
                    exit 1
                fi
                if [ -n "$existing_branches" ]; then
                    echo "::warning::An automated dependency-update pull request is already open; skipping this run."
                    exit 0
                fi

                branch="automation/update-clean-website-dependencies-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
                git switch -c "$branch"
                git commit -m "Automated website dependency update - ${{ steps.current_date.outputs.NOW }}.${{ github.run_number }}"
                gh auth setup-git
                git push --set-upstream origin "$branch"
                gh pr create \
                    --base main \
                    --head "$branch" \
                    --title "Automated website dependency update - ${{ steps.current_date.outputs.NOW }}.${{ github.run_number }}" \
                    --body "Automated website dependency maintenance. The workflow ran the website build and unit tests; review the dependency changes before merging."